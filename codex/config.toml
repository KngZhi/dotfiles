model = "gpt-5.3-codex"
model_reasoning_effort = "high"
tool_output_token_limit = 25000
# Leave room for native compaction near the 272–273k context window.
# Formula: 273000 - (tool_output_token_limit + 15000)
# With tool_output_token_limit=25000 ⇒ 273000 - (25000 + 15000) = 233000
model_auto_compact_token_limit = 233000
approval_policy = "never"
sandbox_mode    = "workspace-write"
personality = "pragmatic"
suppress_unstable_features_warning = true

[features]
ghost_commit = false
apply_patch_freeform = true
skills = true
unified_exec = true
shell_snapshot = true
collab = true

[projects."/Users/amd/repo"]
trust_level = "trusted"

[projects."/Users/amd/repo/chile-mono"]
trust_level = "trusted"

[projects."/Users/amd/repo/chile-mono/data"]
trust_level = "trusted"

[projects."/Users/amd/.codex"]
trust_level = "trusted"

[notice]
"hide_gpt-5.1-codex-max_migration_prompt" = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"

[mcp_servers.k2046]
command = "node"
args = ["/Users/amd/repo/chile-mono/apps/k2046-mcp/dist/index.js"]

[mcp_servers.k2046.tools.get_tool_output_schema]
approval_mode = "approve"

[mcp_servers.k2046.tools.get_stock_transfers]
approval_mode = "approve"

[mcp_servers.k2046.tools.get_stock_transfer_details]
approval_mode = "approve"

[plugins."github@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true
