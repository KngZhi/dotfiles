# 迁自 Air crontab（chile-mono ops/cron/crontab.in 的 0 20 * * * beancount-sync），过渡方案：
# chile-accounting PR #7 的云端工作流上线后由它接手。运营者 2026-10-11 同意本任务自己提交并推送追加的账目。
# 三步串行：拉取账本 -> 同步昨天日结（与 crontab.in 完全一致）-> business/ 有改动才提交推送。
# pre-commit 钩子跑 scripts/lint.sh（bean-check）；lint 失败则提交失败、改动留在工作区等人处理。
# 第 1、3 步也经 run.sh 执行：失败同样推 Telegram（作业名 beancount-pull / beancount-commit，
# 不在 jobs.toml，看门狗不监控它们）。Intel 上 cron 守护进程已关闭，Dagu 是唯一调度器。不重试。
description: 把昨天的 K2046 日结写进 chile-accounting 账本，有改动则提交并推送 main；任一步失败推 Telegram
schedule: "0 20 * * *"
hist_retention_days: 30
max_active_runs: 1
env:
  - SHELL: /bin/bash
  - PATH: /Users/amd/.local/share/mise/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
steps:
  - name: pull
    working_dir: /Users/amd
    run: /Users/amd/.local/share/chile-mono-cron/ops/cron/run.sh beancount-pull git -C /Users/amd/repo/chile-accounting pull --ff-only
  - name: sync
    depends: pull
    working_dir: /Users/amd
    run: /Users/amd/.local/share/chile-mono-cron/ops/cron/run.sh beancount-sync /Users/amd/repo/chile-accounting/scripts/sync-yesterday.sh
  - name: commit
    depends: sync
    working_dir: /Users/amd/repo/chile-accounting
    run: |
      exec /Users/amd/.local/share/chile-mono-cron/ops/cron/run.sh beancount-commit /bin/bash -c '
      set -euo pipefail
      cd /Users/amd/repo/chile-accounting
      if [ -z "$(git status --porcelain business)" ]; then
        echo "business/ 无改动，不提交"
        exit 0
      fi
      day="$(date -v-1d +%Y-%m-%d)"
      git add business
      git commit -q -m "sync(income): $day"
      git push -q origin main
      git log -1 --format="已提交并推送 %h %s"
      '
