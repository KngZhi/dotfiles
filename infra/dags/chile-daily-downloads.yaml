# 迁自 Air crontab（chile-mono ops/cron/crontab.in 渲染结果）。时间表的唯一来源仍是 crontab.in：
# 那边改了时间，这里同步改。Intel 上 cron 守护进程已关闭（roles/base/tasks/cron.yml），
# deploy.py 装进来的 crontab 不会触发，Dagu 是唯一的调度器。不重试：run.sh 失败即推 Telegram。
description: 每日库存数据下载、库存预测并提交推送到 chile-mono master，结果经 run.sh --report 推 Telegram
schedule: "0 23 * * *"
hist_retention_days: 30
max_active_runs: 1
env:
  - SHELL: /bin/bash
  - PATH: /Users/amd/.local/share/mise/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
# run.sh 失败时已经推过 Telegram；用空操作换掉 base.yaml 的默认失败处理，免得同一次失败推两条。
handler_on:
  failure:
    run: "true"
steps:
  - name: run
    working_dir: /Users/amd
    run: /Users/amd/.local/share/chile-mono-cron/ops/cron/run.sh --report daily-downloads /Users/amd/.local/share/chile-mono-cron/ops/cron/daily-downloads.sh
