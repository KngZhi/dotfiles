name: order-sheet-watch
description: 工厂订单表每日盯表（chile-ops skills/post-order-follow-up）：有变化才写 Linear SAOKO。只看不写请手动跑 order-sheet-watch-dry。
schedule: "57 8 * * *"
hist_retention_days: 60
max_active_runs: 1
steps:
  - name: pull-chile-ops
    command: git -C $HOME/repo/chile-ops pull -q --ff-only
  - name: run
    depends: pull-chile-ops
    retry_policy:          # exit 2 = sheet could not be read completely; safe to retry after a pause
      limit: 2
      interval_sec: 300
      exit_code: [2]
    working_dir: $HOME/repo/chile-ops
    script: |
      set -euo pipefail
      export OP_SERVICE_ACCOUNT_TOKEN="$(security find-generic-password -s op-service-account -w)"
      export LINEAR_API_KEY="$(op read 'op://DEV/Linear Cli SAOKO/credential')"
      python3 skills/post-order-follow-up/scripts/order_watch_run.py \
        --config skills/post-order-follow-up/order_watch.json \
        --state-root "$HOME/.local/state/chile-ops/order-sheet-watch" --apply
