# What the home server runs. Data only: the services role (next step) consumes this.
# Order = migration order from the Air. WhatsApp last (single session), per-machine agents
# (type4me, cass, skills-update) are NOT here: they stay on the machine the person types on.
manage_runtimes: true
manage_tailscale: true
tailscale_version: v1.104.1
pnpm_version: "11.9.0"          # chile-mono package.json packageManager

services:
  - name: github-runners
    repo: none
    note: "2 runners, not 8: one `ci` and one `deploy`. osx-x64 tarball from actions/runner."
    labels: [ci, deploy]
  - name: order-printer-local-server
    repo: https://github.com/KngZhi/order-printer
    root: "{{ ansible_env.HOME }}/services/order-printer-local-server"
    plists: [com.order-printer.local-server, com.order-printer.local-server-heartbeat, com.order-printer.local-server-autodeploy]
    needs_gui: true          # Scotiabank headed Chrome
    health: "http://127.0.0.1:3001/health"
    after_move: "fly secrets set BANK_SERVICE_URL/FACTURA_SERVICE_URL=http://<intel tailscale ip>:3001 -a order-printer"
  - name: hermes
    root: "{{ ansible_env.HOME }}/.hermes"
    plists: [ai.hermes.gateway, ai.hermes.gateway-watchdog]
    python: "3.11"
  - name: linear-local-agents
    repo: https://github.com/KngZhi/dotfiles
    path: shared/linear-agents
    plists: [com.junwei.linear-local-agents.bridge, com.junwei.linear-local-agents.claude, com.junwei.linear-local-agents.codex]
  - name: agent-runtime-trigger
    repo: https://github.com/KngZhi/agent-runtime-trigger
    plists: [com.junwei.agent-runtime-trigger.dev, com.junwei.agent-runtime-trigger.update]
  - name: cliproxyapi
    plists: [homebrew.mxcl.cliproxyapi]
    note: "brew formula on the Air; on Intel use the vendor binary, not a Tier 3 source build"
  - name: eink-board
    repo: https://github.com/KngZhi/eink-board
    plists: [local.eink-board]
  - name: chile-ops-whatsapp-status-daily
    repo: https://github.com/KngZhi/chile-ops
    plists: [com.chile-ops.whatsapp-status-daily]
  - name: ispy-agent-dvr
    plists: [com.ispy.agent.dvr]
    needs_gui: true
  - name: saoko-whatsapp
    repo: https://github.com/KngZhi/saoko-whatsapp
    plists: [com.saoko.docker-desktop, com.saoko.whatsapp-bridge, com.saoko.whatsapp-worker, com.saoko.whatsapp-watchdog, com.saoko.waha-probe]
    python: "3.12"
    before_move: "deploy.sh needs a deploy lock and group rollback (ENG-104); WAHA image must be an amd64 tag"
    single_session: true

# GitHub self-hosted runners. KngZhi is a personal account, so runners are per repository.
# chile-mono gets three (most of the work happens there), the rest one each: 7 listeners.
runner_version: "2.338.0"
runner_sha256: dea7a58796ce215fc424a8b27c0fdd9b813fa5fc03d109a4a1d38131d6bfa1a3   # actions-runner-osx-x64
runners_root: "{{ ansible_env.HOME }}/services/github-runners"
github_owner: KngZhi
runner_name_prefix: mbp-intel
runners:
  - { name: chile-mono-1, repo: chile-mono, labels: [chile-mono-local, chile-mono-ci] }
  - { name: chile-mono-2, repo: chile-mono, labels: [chile-mono-local, chile-mono-ci] }
  - { name: chile-mono-3, repo: chile-mono, labels: [chile-mono-local, chile-mono-ci] }
  - { name: agent-runtime-trigger, repo: agent-runtime-trigger, labels: [agent-runtime-trigger-local] }
  - { name: google-ags-management, repo: google-ags-management, labels: [google-ags-management-local] }
  - { name: order-printer, repo: order-printer, labels: [order-printer-local] }
  - { name: proving-ground, repo: proving-ground, labels: [proving-ground-local] }

# Dagu: the one panel for scheduled jobs, health checks and manual operations (chosen 2026-10-11
# over Cronicle). DAG files live in infra/dags and are copied to ~/.config/dagu/dags.
dagu_version: "2.19.0"
dagu_sha256: d41d88020480493020e0f80b751b706517ade2b9606337017cdd8e954dbe0b7d
dagu_bind_host: 100.122.236.59        # Tailscale address: reachable from the tailnet only
dagu_port: 8080
dagu_tz: America/Santiago
