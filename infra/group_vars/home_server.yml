# Dagu: the one panel for scheduled jobs, health checks and manual operations (chosen 2026-10-11
# over Cronicle). DAG files live in infra/dags and are copied to ~/.config/dagu/dags.
dagu_version: "2.19.0"
dagu_sha256: d41d88020480493020e0f80b751b706517ade2b9606337017cdd8e954dbe0b7d
dagu_bind_host: 100.122.236.59        # Tailscale address: reachable from the tailnet only
dagu_port: 8080
dagu_tz: America/Santiago

# Alert bot (@saoko_notify_bot): one Telegram bot for ops alerts. 1Password holds the only
# copy of its token; notify-bot.yml writes it to the consumers below. Each keeps its own
# chat id. Not here, on purpose: order-printer (its TELEGRAM_BOT_TOKEN is the app's own
# customer-facing bot) and google-ags-compact-photos (a bot with buttons, to the boss chat).
notify_bot_op_ref: "op://DEV/Telegram Bot Notify Bot/credential"
fly_api_token_op_ref: "op://DEV/FLY_API_TOKEN/credential"
notify_bot_env_files:
  - { path: "{{ ansible_env.HOME }}/.local/share/chile-mono-cron/.env", key: TELEGRAM_BOT_TOKEN }   # run.sh, dagu-probe
  - { path: "{{ ansible_env.HOME }}/repo/chile-mono/.env", key: TELEGRAM_BOT_TOKEN }
  # saoko-whatsapp: the watchdog, and through watchdog/scripts/notify.sh its deploy notices
  # and chile-ops' daily Status album. Both chat ids in that file (SAOKO_TELEGRAM_CHAT_ID,
  # SAOKO_NOTIFY_CHAT_ID) are the alert bot's private chat: the code's default, the group
  # Ntf_k2046, does not have this bot in it.
  - { path: "{{ ansible_env.HOME }}/.config/saoko-whatsapp/env", key: SAOKO_TELEGRAM_BOT_TOKEN }
notify_bot_fly_apps:
  - { app: chile-mono-shopify-order-sync }
  # A one-shot machine outside Fly Launch, so there is nothing to restart: staged, as
  # chile-mono's rotate-k2046-token.sh does it, and read at the machine's next start.
  # `fly secrets list` reports every secret of this app as Staged for the same reason;
  # that is its normal state, not a pending deploy.
  - { app: chile-mono-shopify-k2046-sync, stage: true }
notify_bot_github_repos:
  - KngZhi/chile-mono        # shopify-sync.yml's failure step

# Discord server "SAOKO Ops": the same ops alerts in four private channels, one webhook each.
# A webhook URL is a credential (anyone holding it can post), so 1Password holds the only copy,
# one item with a field per channel; notify-bot.yml writes every URL it can read to the env
# files below. chile-mono's ops/cron/notify.sh reads the keys from its environment or from that
# env file (line by line, never sourced), picks the channel by job name or NOTIFY_CHANNEL, and
# skips Discord for a channel whose key is absent, so a field may stay empty until its channel
# is ready. Telegram stays as it is.
discord_webhooks_op_item: "op://DEV/Discord Webhooks SAOKO Ops"
discord_webhook_channels:       # 1Password field -> env key
  - { field: deploy, key: DISCORD_WEBHOOK_DEPLOY }   # 部署
  - { field: errors, key: DISCORD_WEBHOOK_ERRORS }   # 报错
  - { field: health, key: DISCORD_WEBHOOK_HEALTH }   # 健康
  - { field: daily, key: DISCORD_WEBHOOK_DAILY }     # 日报
discord_webhook_env_files:
  - "{{ ansible_env.HOME }}/.local/share/chile-mono-cron/.env"   # notify.sh, through run.sh and dagu-probe
# Dagu's own failed-run notices also go to 报错. Dagu has no Discord channel type, but Discord
# takes Slack-format payloads at the webhook URL + /slack, so notify-bot.yml keeps a Slack-type
# channel of this name and a route to it on the global rules (Telegram's route is left alone).
# It skips this when the errors field is empty. Events as Dagu names them; add dag.run.aborted
# or dag.run.rejected here to widen it.
dagu_discord_channel_name: discord-errors
dagu_discord_events: [dag.run.failed]
