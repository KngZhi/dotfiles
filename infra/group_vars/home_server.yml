runner_sha256: dea7a58796ce215fc424a8b27c0fdd9b813fa5fc03d109a4a1d38131d6bfa1a3   # actions-runner-osx-x64
runners_root: "{{ ansible_env.HOME }}/services/github-runners"
github_owner: KngZhi
runner_name_prefix: mbp-intel
runners:
  - { name: chile-mono-1, repo: chile-mono, labels: [chile-mono-local, chile-mono-ci] }
  - { name: chile-mono-2, repo: chile-mono, labels: [chile-mono-local, chile-mono-ci] }
  - { name: chile-mono-3, repo: chile-mono, labels: [chile-mono-local, chile-mono-ci] }
