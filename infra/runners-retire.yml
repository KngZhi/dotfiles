# Remove the old runners from a machine once the Intel ones are online:
#   ansible-playbook runners-retire.yml -l mbair   (or -l pro)
# Finds every configured runner under ~/services/github-runners, unloads it, deregisters it
# with a removal token fetched on the control node, and deletes the directory and plist.
- name: Retire self-hosted runners
  hosts: terminals:dev
  gather_facts: true
  vars:
    runners_root: "{{ ansible_env.HOME }}/services/github-runners"
    github_owner: KngZhi
  tasks:
    - name: Configured runners here
      ansible.builtin.find:
        paths: "{{ runners_root }}"
        patterns: ".runner"
        hidden: true
        recurse: true
        depth: 2
      register: found

    - name: Read each .runner
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ found.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: runner_files

    - name: Retire each
      ansible.builtin.include_tasks: retire-one.yml
      loop: "{{ runner_files.results }}"
      loop_control:
        loop_var: rf
        label: "{{ rf.item.path | dirname | basename }}"
