# pnpm for the chile-mono production clone (cron jobs run from Dagu, deploys from the
# self-hosted runner). Installed into mise's node with its own npm: no Homebrew build.
# chile-mono's deploy.py and crontab hard-code /opt/homebrew/bin/pnpm; on this Intel
# /opt/homebrew/bin -> /usr/local/bin (air-paths.yml), and /usr/local/bin/pnpm links the mise shim, which
# runs pnpm under mise's node (the old Homebrew node 20 in /usr/local/bin is too old).
- name: Installed pnpm version
  ansible.builtin.command: "{{ ansible_env.HOME }}/.local/share/mise/shims/pnpm --version"
  args:
    chdir: "{{ ansible_env.HOME }}"
  register: pnpm_have
  changed_when: false
  failed_when: false

- name: Install pnpm into mise's node
  ansible.builtin.command: "{{ local_bin }}/mise exec node -- npm install -g pnpm@{{ pnpm_version }}"
  when: pnpm_have.rc != 0 or pnpm_have.stdout.strip() != pnpm_version
  register: pnpm_install

- name: Refresh mise shims
  ansible.builtin.command: "{{ local_bin }}/mise reshim"
  when: pnpm_install is changed

- name: /opt/homebrew/bin/pnpm resolves to the mise shim
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.local/share/mise/shims/pnpm"
    dest: /usr/local/bin/pnpm
    state: link
