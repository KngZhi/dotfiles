# A server must not sleep. Autologin for the GUI session is set by hand once
# (sysadminctl needs the account password): see infra/README.md.
- name: Never sleep on AC, wake on LAN, restart after power loss
  become: true
  ansible.builtin.command: pmset -c sleep 0 disksleep 0 displaysleep 15 womp 1 autorestart 1
  changed_when: true
  tags: sudo
