# One Telegram bot for ops alerts. Its token has a single source, 1Password
# (notify_bot_op_ref in group_vars/home_server.yml); this playbook copies it to every
# consumer listed there. To change the bot: edit the 1Password item, then
#   ansible-playbook notify-bot.yml                 home server env files and Dagu's channel, then the Discord webhooks (second play)
#   ansible-playbook notify-bot.yml --tags cloud    Fly and GitHub secrets, Telegram token and Discord webhooks
#                                                   (restarts the Fly apps that are not staged)
#   ansible-playbook notify-bot.yml --tags discord  the Discord webhooks on the server and in Dagu (second play)
# Only the token is copied. Each consumer keeps its own chat id, and the bot must already
# be able to post there (a private chat it was started in, or a group it was added to).
#
# The second play does the same for the Discord server "SAOKO Ops": one webhook per channel,
# all fields of one 1Password item (discord_webhooks_op_item), copied to
#   - the home server env files in discord_webhook_env_files (each lists the keys it gets),
#   - Dagu's failed-run rules (tag discord),
#   - Fly secrets (discord_webhook_fly_apps) and GitHub Actions secrets
#     (discord_webhook_github_repos), only with --tags cloud, like the Telegram token.
# It is a play of its own because a missing field is normal there (a channel not set up yet is
# skipped, per destination), where a missing Telegram token stops the run. It adds Discord next
# to Telegram and changes nothing about Telegram. Google Apps Script properties are not set
# here: they are set by hand in the Apps Script editor.
- name: Alert bot token from 1Password to its consumers
  hosts: mbp-intel
  gather_facts: true
  tasks:
    - name: Read the token on the control node
      ansible.builtin.set_fact:
        notify_bot_token: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (notify_bot_op_ref | quote)) }}"
      no_log: true
      tags: always

    - name: Token in the server's env files
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ notify_bot_token }}"
        create: false
      loop: "{{ notify_bot_env_files }}"
      loop_control:
        label: "{{ item.path }}"
      no_log: true
      diff: false

    - name: Dagu's notification channels
      ansible.builtin.uri:
        url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-channels"
        use_netrc: false
      register: dagu_channels
      delegate_to: localhost

    # Dagu never returns the stored token, so there is nothing to compare: always written.
    - name: Token in Dagu's Telegram channel
      ansible.builtin.uri:
        url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-channels/{{ item.id }}"
        method: PUT
        body_format: json
        body:
          name: "{{ item.name }}"
          type: telegram
          enabled: "{{ item.enabled }}"
          telegram: >-
            {{ item.telegram | dict2items | rejectattr('key', 'in', ['botTokenConfigured', 'botTokenPreview'])
               | items2dict | combine({'botToken': notify_bot_token}) }}
        use_netrc: false
      loop: "{{ dagu_channels.json.channels | selectattr('type', 'equalto', 'telegram') }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      changed_when: false
      delegate_to: localhost

    # `fly secrets import` reads NAME=VALUE from stdin, so the token stays out of argv.
    - name: Token in Fly secrets
      ansible.builtin.command:
        argv: "{{ ['fly', 'secrets', 'import', '--app', item.app] + (['--stage'] if item.stage | default(false) else []) }}"
        stdin: "TELEGRAM_BOT_TOKEN={{ notify_bot_token }}"
      environment:
        FLY_API_TOKEN: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (fly_api_token_op_ref | quote)) }}"
      loop: "{{ notify_bot_fly_apps }}"
      loop_control:
        label: "{{ item.app }}"
      no_log: true
      delegate_to: localhost
      tags: [never, cloud]

    - name: Token in GitHub Actions secrets
      ansible.builtin.command:
        argv: [gh, secret, set, TELEGRAM_BOT_TOKEN, --repo, "{{ item }}"]
        stdin: "{{ notify_bot_token }}"
      loop: "{{ notify_bot_github_repos }}"
      no_log: true
      delegate_to: localhost
      tags: [never, cloud]

- name: Discord webhooks from 1Password to the cron env file and Dagu
  hosts: mbp-intel
  gather_facts: true
  tasks:
    # One `op read` per field, never failing the play: a field or the whole item may not exist
    # yet, and `op` may be signed out. Nothing from the result is printed (no_log).
    - name: Read the webhooks on the control node
      ansible.builtin.command:
        argv: [op, read, "{{ discord_webhooks_op_item }}/{{ item.field }}"]
      loop: "{{ discord_webhook_channels }}"
      loop_control:
        label: "{{ item.field }}"
      register: discord_webhook_reads
      failed_when: false
      changed_when: false
      no_log: true
      delegate_to: localhost
      tags: [discord, cloud]

    # What came back as an https URL; anything else (an empty or mistyped field) counts as missing.
    - name: Keep the channels that have a URL
      ansible.builtin.set_fact:
        discord_webhooks_found: >-
          {{ discord_webhook_reads.results
             | selectattr('rc', 'defined') | selectattr('stdout', 'defined')
             | selectattr('rc', 'equalto', 0)
             | selectattr('stdout', 'match', '\s*https://')
             | list }}
      no_log: true
      tags: [discord, cloud]

    # env key -> URL, for every destination below. Senders post {"content": ...}; the /slack
    # form is only for Dagu, so never store it anywhere else.
    - name: Webhook URLs by env key
      ansible.builtin.set_fact:
        discord_webhook_values: >-
          {{ dict(discord_webhooks_found | map(attribute='item.key')
                  | zip(discord_webhooks_found | map(attribute='stdout')
                        | map('trim') | map('regex_replace', '/+$', '') | map('regex_replace', '/slack$', ''))) }}
      no_log: true
      tags: [discord, cloud]

    # Each file gets the keys listed for it, and only those that were read.
    - name: Webhooks in the server's env files
      ansible.builtin.lineinfile:
        path: "{{ item.0.path }}"
        regexp: "^{{ item.1 }}="
        line: "{{ item.1 }}={{ discord_webhook_values[item.1] }}"
        create: false
      loop: "{{ discord_webhook_env_files | subelements('env_keys') }}"
      loop_control:
        label: "{{ item.0.path }} {{ item.1 }}"
      when: item.1 in discord_webhook_values
      no_log: true
      diff: false
      tags: discord

    # `fly secrets import` reads NAME=VALUE lines from stdin, so the URLs stay out of argv.
    # Same --stage rule as the Telegram token. An app with none of its keys read is skipped.
    - name: Webhooks in Fly secrets
      ansible.builtin.command:
        argv: "{{ ['fly', 'secrets', 'import', '--app', item.app] + (['--stage'] if item.stage | default(false) else []) }}"
        stdin: "{% for k in wanted %}{{ k }}={{ discord_webhook_values[k] }}\n{% endfor %}"
      environment:
        FLY_API_TOKEN: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (fly_api_token_op_ref | quote)) }}"
      vars:
        wanted: "{{ item.env_keys | select('in', discord_webhook_values) | list }}"
      loop: "{{ discord_webhook_fly_apps }}"
      loop_control:
        label: "{{ item.app }}"
      when: wanted | length > 0
      no_log: true
      delegate_to: localhost
      tags: [never, cloud]

    - name: Webhooks in GitHub Actions secrets
      ansible.builtin.command:
        argv: [gh, secret, set, "{{ item.1 }}", --repo, "{{ item.0.repo }}"]
        stdin: "{{ discord_webhook_values[item.1] }}"
      loop: "{{ discord_webhook_github_repos | subelements('env_keys') }}"
      loop_control:
        label: "{{ item.0.repo }} {{ item.1 }}"
      when: item.1 in discord_webhook_values
      no_log: true
      delegate_to: localhost
      tags: [never, cloud]

    # Names only below: channels, env keys, paths, apps and repos; never a value.
    - name: Which Discord webhooks were read
      ansible.builtin.debug:
        msg: >-
          Discord webhooks read: {{ found | join(', ') or 'none' }}.
          Skipped, no URL in 1Password ({{ discord_webhooks_op_item }}): {{ missing | join(', ') or 'none' }}.
      vars:
        found: "{{ discord_webhooks_found | map(attribute='item.field') | list }}"
        missing: "{{ discord_webhook_channels | map(attribute='field') | reject('in', found) | list }}"
      tags: [discord, cloud]

    - name: Where the Discord webhooks went on the server
      ansible.builtin.debug:
        msg: "{{ item.path }}: wrote {{ item.env_keys | select('in', discord_webhook_values) | join(', ') or 'none' }}; skipped {{ item.env_keys | reject('in', discord_webhook_values) | join(', ') or 'none' }}"
      loop: "{{ discord_webhook_env_files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: discord

    - name: Where the Discord webhooks went in Fly
      ansible.builtin.debug:
        msg: "Fly app {{ item.app }}: set {{ item.env_keys | select('in', discord_webhook_values) | join(', ') or 'none' }}; skipped {{ item.env_keys | reject('in', discord_webhook_values) | join(', ') or 'none' }}"
      loop: "{{ discord_webhook_fly_apps }}"
      loop_control:
        label: "{{ item.app }}"
      tags: [never, cloud]

    - name: Where the Discord webhooks went in GitHub
      ansible.builtin.debug:
        msg: "GitHub repo {{ item.repo }}: set {{ item.env_keys | select('in', discord_webhook_values) | join(', ') or 'none' }}; skipped {{ item.env_keys | reject('in', discord_webhook_values) | join(', ') or 'none' }}"
      loop: "{{ discord_webhook_github_repos }}"
      loop_control:
        label: "{{ item.repo }}"
      tags: [never, cloud]

    # Dagu's own failed-run notices, the same ones its Telegram channel gets. Dagu v2.19.0 API
    # (api/v1/api.yaml; the web UI's Notifications page calls the same routes): a Slack-type
    # channel takes {webhookUrl}; the global rules are /notification-routes/global, and a PUT
    # replaces the whole set, so the existing routes are sent back unchanged with ours added.
    - name: Dagu's failed-run notices to the Discord errors channel
      when: discord_webhooks_found | selectattr('item.field', 'equalto', 'errors') | list | length > 0
      tags: discord
      block:
        # The URL for Dagu is the webhook plus /slack.
        - name: The errors webhook in Slack format
          ansible.builtin.set_fact:
            dagu_discord_url: >-
              {%- set url = (discord_webhooks_found | selectattr('item.field', 'equalto', 'errors') | map(attribute='stdout') | first | trim) | regex_replace('/+$', '') -%}
              {{ url if url.endswith('/slack') else url ~ '/slack' }}
          no_log: true

        - name: Dagu's channels, to find the Discord one
          ansible.builtin.uri:
            url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-channels"
            use_netrc: false
          register: dagu_channels_now
          delegate_to: localhost

        - name: Our channel, if Dagu has it already
          ansible.builtin.set_fact:
            dagu_discord_channel: >-
              {{ dagu_channels_now.json.channels | selectattr('name', 'equalto', dagu_discord_channel_name)
                 | selectattr('type', 'equalto', 'slack') | first | default({}) }}

        - name: Dagu's Discord errors channel, created
          ansible.builtin.uri:
            url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-channels"
            method: POST
            body_format: json
            body:
              name: "{{ dagu_discord_channel_name }}"
              type: slack
              enabled: true
              slack:
                webhookUrl: "{{ dagu_discord_url }}"
            status_code: 201
            use_netrc: false
          register: dagu_discord_created
          when: dagu_discord_channel | length == 0
          changed_when: true
          no_log: true
          delegate_to: localhost

        # Dagu never returns the stored URL, so there is nothing to compare: always written
        # (this also carries a rotated webhook). A PUT replaces the channel, so enabled and the
        # message template are sent back as they are.
        - name: Dagu's Discord errors channel, URL refreshed
          ansible.builtin.uri:
            url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-channels/{{ dagu_discord_channel.id }}"
            method: PUT
            body_format: json
            body:
              name: "{{ dagu_discord_channel.name }}"
              type: slack
              enabled: "{{ dagu_discord_channel.enabled }}"
              slack: >-
                {{ {'webhookUrl': dagu_discord_url}
                   | combine({'messageTemplate': dagu_discord_channel.slack.messageTemplate}
                             if dagu_discord_channel.slack.messageTemplate | default('') else {}) }}
            use_netrc: false
          when: dagu_discord_channel | length > 0
          changed_when: false
          no_log: true
          delegate_to: localhost

        - name: Dagu's global notification routes
          ansible.builtin.uri:
            url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-routes/global"
            use_netrc: false
          register: dagu_routes
          delegate_to: localhost

        # Adds the route, or brings an existing route's events in line with dagu_discord_events
        # (keeping its id and enabled flag). Every other route is sent back unchanged.
        - name: Route to the Discord errors channel, added or updated next to the existing ones
          ansible.builtin.uri:
            url: "http://{{ dagu_bind_host }}:{{ dagu_port }}/api/v1/notification-routes/global"
            method: PUT
            body_format: json
            body:
              enabled: "{{ dagu_routes.json.enabled }}"
              inheritGlobal: "{{ dagu_routes.json.inheritGlobal }}"
              routes: >-
                {{ (existing | rejectattr('channelId', 'equalto', channel_id) | list)
                   + [ (mine[0] | combine({'events': dagu_discord_events})) if mine | length > 0
                       else {'channelId': channel_id, 'enabled': true, 'events': dagu_discord_events} ] }}
            use_netrc: false
          vars:
            channel_id: "{{ dagu_discord_channel.id if dagu_discord_channel | length > 0 else dagu_discord_created.json.id }}"
            existing: "{{ dagu_routes.json.routes | default([], true) }}"
            mine: "{{ existing | selectattr('channelId', 'equalto', channel_id) | list }}"
          when: (mine | length == 0) or ((mine[0].events | default([], true) | sort) != (dagu_discord_events | sort))
          changed_when: true
          delegate_to: localhost
